syntax = "proto3";

package fuzz;

option go_package = "github.com/tidwall/gjson/artifacts";

message JSON {
  oneof value {
    bool bool_value = 1;
    double number_value = 2;
    string string_value = 3;
    Object object_value = 4;
    Array array_value = 5;
    NullValue null_value = 6;
  }
}

message Object {
  repeated Field fields = 1;
}

message Field {
  string key = 1;
  JSON value = 2;
}

message Array {
  repeated JSON values = 1;
}

message NullValue {}